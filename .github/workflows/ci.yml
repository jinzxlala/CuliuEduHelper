name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://culiu_test:ci-only-password@127.0.0.1:5432/culiu_test
      KNOWLEDGE_ANALYSIS_ROOT: ${{ github.workspace }}/.ci/analysis
      KNOWLEDGE_MANIFEST_PATH: ${{ github.workspace }}/knowledge/source-manifest.v1.json
      KNOWLEDGE_TRANSCRIPT_2025_ROOT: ${{ github.workspace }}/.ci/transcripts/2025
      KNOWLEDGE_TRANSCRIPT_2026_ROOT: ${{ github.workspace }}/.ci/transcripts/2026
      LOCAL_STORAGE_ROOT: /tmp/culiu-evidence
      MEILI_HOST: http://127.0.0.1:7700
      MEILI_MASTER_KEY: ci-only-meilisearch-master-key
      REDIS_URL: redis://127.0.0.1:6379
      WORKER_CONCURRENCY: 1

    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_DB: culiu_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: culiu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U culiu_test -d culiu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.10-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      meilisearch:
        image: getmeili/meilisearch:v1.50.0
        env:
          MEILI_ENV: production
          MEILI_MASTER_KEY: ci-only-meilisearch-master-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:7700/health >/dev/null 2>&1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Apply migrations
        run: pnpm --filter @culiu/database db:migrate

      - name: Run PostgreSQL, Redis, and Meilisearch integration tests
        run: pnpm test:integration
