name: culiu-edu-helper-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16.14-bookworm
    container_name: ${POSTGRES_CONTAINER_NAME:-culiu-edu-helper-postgres}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${POSTGRES_MAINTENANCE_PORT:-15432}:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 1.5
    mem_limit: 1g
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  redis:
    image: redis:7.4.10-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    cpus: 0.5
    mem_limit: 512m
    logging: *default-logging
    <<: *service-security
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  meilisearch:
    image: getmeili/meilisearch:v1.50.0
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MEILI_MAINTENANCE_PORT:-17700}:7700
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      MEILI_DB_PATH: /meili_data
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    cpus: 2
    mem_limit: 2g
    logging: *default-logging
    <<: *service-security

  migrate:
    image: culiu-edu-helper-worker:${CULIU_IMAGE_TAG:?CULIU_IMAGE_TAG must be set}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    command: ["node", "node_modules/@culiu/database/dist/cli/migrate.js"]
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    <<: *service-security

  knowledge-web:
    image: culiu-edu-helper-knowledge-web:${CULIU_IMAGE_TAG:?CULIU_IMAGE_TAG must be set}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: knowledge-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:?KNOWLEDGE_DATABASE_URL must be set}
      KNOWLEDGE_DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      MEILI_SEARCH_API_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      MEILI_TASK_POLL_INTERVAL_MS: ${MEILI_TASK_POLL_INTERVAL_MS:-500}
      MEILI_TASK_TIMEOUT_MS: ${MEILI_TASK_TIMEOUT_MS:-600000}
      KNOWLEDGE_NEXTAUTH_URL: https://${KNOWLEDGE_APP_DOMAIN:?KNOWLEDGE_APP_DOMAIN must be set}
      KNOWLEDGE_NEXTAUTH_SECRET: ${KNOWLEDGE_NEXTAUTH_SECRET:?KNOWLEDGE_NEXTAUTH_SECRET must be set}
      NEXTAUTH_URL: https://${KNOWLEDGE_APP_DOMAIN:?KNOWLEDGE_APP_DOMAIN must be set}
      NEXTAUTH_SECRET: ${KNOWLEDGE_NEXTAUTH_SECRET:?KNOWLEDGE_NEXTAUTH_SECRET must be set}
      LOCAL_STORAGE_ROOT: /srv/culiu/evidence
      CULIU_GIT_COMMIT_SHA: ${CULIU_GIT_COMMIT_SHA:?CULIU_GIT_COMMIT_SHA must be set}
    volumes:
      - type: bind
        source: ${LOCAL_STORAGE_HOST_PATH:?LOCAL_STORAGE_HOST_PATH must be set}
        target: /srv/culiu/evidence
    networks:
      - edge
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: 1.5
    mem_limit: 1g
    logging: *default-logging
    <<: *service-security

  operations-web:
    image: culiu-edu-helper-operations-web:${CULIU_IMAGE_TAG:?CULIU_IMAGE_TAG must be set}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: operations-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OPERATIONS_DATABASE_URL: ${OPERATIONS_DATABASE_URL:?OPERATIONS_DATABASE_URL must be set}
      OPERATIONS_DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      OPERATIONS_NEXTAUTH_URL: https://${OPERATIONS_APP_DOMAIN:?OPERATIONS_APP_DOMAIN must be set}
      OPERATIONS_NEXTAUTH_SECRET: ${OPERATIONS_NEXTAUTH_SECRET:?OPERATIONS_NEXTAUTH_SECRET must be set}
      NEXTAUTH_URL: https://${OPERATIONS_APP_DOMAIN:?OPERATIONS_APP_DOMAIN must be set}
      NEXTAUTH_SECRET: ${OPERATIONS_NEXTAUTH_SECRET:?OPERATIONS_NEXTAUTH_SECRET must be set}
      LOCAL_STORAGE_ROOT: /srv/culiu/evidence
      CULIU_GIT_COMMIT_SHA: ${CULIU_GIT_COMMIT_SHA:?CULIU_GIT_COMMIT_SHA must be set}
    volumes:
      - type: bind
        source: ${LOCAL_STORAGE_HOST_PATH:?LOCAL_STORAGE_HOST_PATH must be set}
        target: /srv/culiu/evidence
    networks:
      - edge
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: 1.5
    mem_limit: 1g
    logging: *default-logging
    <<: *service-security

  worker:
    image: culiu-edu-helper-worker:${CULIU_IMAGE_TAG:?CULIU_IMAGE_TAG must be set}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      MEILI_HOST: ${MEILI_HOST:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      MEILI_ADMIN_API_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set}
      DEEPSEEK_PROFILE_MAX_TOKENS: ${DEEPSEEK_PROFILE_MAX_TOKENS:-8192}
      DEEPSEEK_PROFILE_TIMEOUT_MS: ${DEEPSEEK_PROFILE_TIMEOUT_MS:-45000}
      PROFILE_MODEL_PROVIDER: ${PROFILE_MODEL_PROVIDER:-deepseek}
      KNOWLEDGE_EXTRACTION_MODEL_PROVIDER: ${KNOWLEDGE_EXTRACTION_MODEL_PROVIDER:-deepseek}
      KNOWLEDGE_EMBEDDERS_ENABLED: ${KNOWLEDGE_EMBEDDERS_ENABLED:-true}
      MEILI_TASK_POLL_INTERVAL_MS: ${MEILI_TASK_POLL_INTERVAL_MS:-500}
      MEILI_TASK_TIMEOUT_MS: ${MEILI_TASK_TIMEOUT_MS:-600000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      LOCAL_STORAGE_ROOT: /srv/culiu/evidence
      KNOWLEDGE_MANIFEST_PATH: /app/knowledge/source-manifest.v1.json
      KNOWLEDGE_ANALYSIS_ROOT: /srv/culiu/sources/data_origin
      KNOWLEDGE_TRANSCRIPT_2025_ROOT: /srv/culiu/sources/transcripts/2025
      KNOWLEDGE_TRANSCRIPT_2026_ROOT: /srv/culiu/sources/transcripts/2026
    volumes:
      - type: bind
        source: ${LOCAL_STORAGE_HOST_PATH:?LOCAL_STORAGE_HOST_PATH must be set}
        target: /srv/culiu/evidence
      - type: bind
        source: ${KNOWLEDGE_ANALYSIS_HOST_PATH:?KNOWLEDGE_ANALYSIS_HOST_PATH must be set}
        target: /srv/culiu/sources/data_origin
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_TRANSCRIPT_2025_HOST_PATH:?KNOWLEDGE_TRANSCRIPT_2025_HOST_PATH must be set}
        target: /srv/culiu/sources/transcripts/2025
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_TRANSCRIPT_2026_HOST_PATH:?KNOWLEDGE_TRANSCRIPT_2026_HOST_PATH must be set}
        target: /srv/culiu/sources/transcripts/2026
        read_only: true
    networks:
      - backend
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: 1.5
    mem_limit: 1g
    logging: *default-logging
    <<: *service-security

  admin:
    profiles: ["tools"]
    image: culiu-edu-helper-admin:${CULIU_IMAGE_TAG:?CULIU_IMAGE_TAG must be set}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: admin
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      CULIU_BOOTSTRAP_ADMIN_PASSWORD: ${CULIU_BOOTSTRAP_ADMIN_PASSWORD:-}
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging: *default-logging
    <<: *service-security

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    environment:
      KNOWLEDGE_APP_DOMAIN: ${KNOWLEDGE_APP_DOMAIN:?KNOWLEDGE_APP_DOMAIN must be set}
      OPERATIONS_APP_DOMAIN: ${OPERATIONS_APP_DOMAIN:?OPERATIONS_APP_DOMAIN must be set}
      NGINX_ENVSUBST_FILTER: ^(KNOWLEDGE_APP_DOMAIN|OPERATIONS_APP_DOMAIN)$$
    ports:
      - ${PUBLIC_HTTP_PORT:-80}:80
      - ${PUBLIC_HTTPS_PORT:-443}:443
    volumes:
      - type: bind
        source: ./nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
      - type: bind
        source: ./nginx/proxy_params
        target: /etc/nginx/proxy_params
        read_only: true
      - type: bind
        source: ${TLS_CERT_HOST_PATH:?TLS_CERT_HOST_PATH must be set}
        target: /etc/nginx/certs/fullchain.pem
        read_only: true
      - type: bind
        source: ${TLS_KEY_HOST_PATH:?TLS_KEY_HOST_PATH must be set}
        target: /etc/nginx/certs/privkey.pem
        read_only: true
    networks:
      - edge
    depends_on:
      knowledge-web:
        condition: service_healthy
      operations-web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=8m
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    cpus: 0.5
    mem_limit: 256m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

networks:
  backend: {}
  edge: {}
  egress: {}

volumes:
  postgres_data: {}
  redis_data: {}
  meilisearch_data: {}
